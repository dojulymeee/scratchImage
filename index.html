<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Reveal Invitation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            touch-action: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #6b7d8e !important;
        }
    </style>
</head>
<body style="background-color: #6b7d8e !important;" class="text-slate-100 min-h-screen flex items-center justify-center p-3 font-sans select-none overflow-hidden">

    <!-- Haupt-Container: Passt sich dynamisch exakt an das Bild an -->
    <div id="scratch-container" class="relative rounded-2xl overflow-hidden shadow-2xl border border-white/20 flex items-center justify-center">
        
        <!-- Das Bild unter der Rubbelschicht -->
        <img id="secret-image" src="invitation.png" alt="Einladung" class="block max-w-[90vw] max-h-[90vh] w-auto h-auto object-contain pointer-events-none">
        
        <!-- Die Rubbelschicht deckt exakt das geladene Bild ab -->
        <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full touch-none cursor-pointer z-10"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('scratch-container');
        const secretImage = document.getElementById('secret-image');

        let isDrawing = false;

        // --- Web Audio API für den Rubbelsound ---
        let audioCtx = null;
        let noiseNode = null;
        let gainNode = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        function startScratchSound() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (noiseNode) return;

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            filter.Q.value = 3;

            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.15;

            noiseNode.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        function stopScratchSound() {
            if (noiseNode) {
                try {
                    noiseNode.stop();
                    noiseNode.disconnect();
                } catch (e) {}
                noiseNode = null;
            }
        }
        // ----------------------------------------

        const coverImage = new Image();
        coverImage.src = 'cover.png'; 

        function initCanvas() {
            // Passt die Canvas-Größe exakt an die tatsächliche Darstellungsgröße des Bildes an
            canvas.width = secretImage.clientWidth;
            canvas.height = secretImage.clientHeight;

            if (coverImage.complete) {
                ctx.drawImage(coverImage, 0, 0, canvas.width, canvas.height);
            } else {
                coverImage.onload = () => {
                    ctx.drawImage(coverImage, 0, 0, canvas.width, canvas.height);
                };
            }
        }

        // Sobald das Bild geladen ist, wird der Rahmen passgenau gesetzt
        secretImage.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);
        
        // Falls das Bild aus dem Cache schon geladen ist:
        if (secretImage.complete) {
            initCanvas();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 35, 0, Math.PI * 2, false);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', (e) => { 
            isDrawing = true; 
            startScratchSound();
            scratch(e); 
        });
        canvas.addEventListener('mousemove', scratch);
        
        window.addEventListener('mouseup', () => { 
            isDrawing = false; 
            stopScratchSound();
        });

        canvas.addEventListener('touchstart', (e) => { 
            isDrawing = true; 
            //startScratchSound();
            scratch(e); 
            e.preventDefault(); 
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => { 
            scratch(e); 
            e.preventDefault(); 
        }, { passive: false });
        
        window.addEventListener('touchend', () => { 
            isDrawing = false; 
            stopScratchSound();
        });
    </script>
</body>
</html>
