<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Reveal Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Force explicit background styling on html/body to prevent iframe color fallback */
        html, body {
            background-color: #f3b4cd !important;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .card-shadow {
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(244, 63, 94, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 font-sans select-none">

    <main class="w-full max-w-3xl h-[90vh] max-h-[850px] flex items-center justify-center">
        <div id="scratch-container" class="relative w-full h-full rounded-2xl overflow-hidden card-shadow border border-pink-900/40 bg-pink-950 flex items-center justify-center">
            
            <img id="invitation-image" 
                 src="invitation.png" 
                 alt="Invitation" 
                 class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none"
                 onerror="this.onerror=null; this.src='https://placehold.co/800x1200/500724/fecdd3?text=invitation.png+Not+Found';" />

            <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full cursor-pointer touch-none z-10"></canvas>

        </div>
    </main>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('scratch-container');

        let isDrawing = false;
        let lastPoint = null;

        function initScratchCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            // Render metallic scratch cover layer
            ctx.globalCompositeOperation = 'source-over';
            
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#475569');
            grad.addColorStop(0.5, '#94a3b8');
            grad.addColorStop(1, '#334155');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add metallic texture grain
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.08})`;
                ctx.fillRect(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 100 + 20,
                    Math.random() * 2 + 1
                );
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing) return;

            const currentPoint = getPos(e);

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = Math.min(canvas.width, canvas.height) * 0.12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            if (lastPoint) {
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(currentPoint.x, currentPoint.y);
            } else {
                ctx.arc(currentPoint.x, currentPoint.y, ctx.lineWidth / 2, 0, Math.PI * 2);
            }
            ctx.stroke();

            lastPoint = currentPoint;
        }

        // Mouse Listeners
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastPoint = getPos(e);
            scratch(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) scratch(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
            lastPoint = null;
        });

        // Touch Listeners
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            lastPoint = getPos(e);
            scratch(e);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing) scratch(e);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDrawing = false;
            lastPoint = null;
        });

        window.addEventListener('resize', initScratchCanvas);
        window.onload = initScratchCanvas;
    </script>
</body>
</html>
