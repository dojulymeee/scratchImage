<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Reveal Invitation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            touch-action: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #6b7d8e !important;
        }
    </style>
</head>
<body style="background-color: #6b7d8e !important;" class="text-slate-100 min-h-screen flex items-center justify-center p-3 font-sans select-none overflow-hidden">

    <!-- Haupt-Container: Passt sich dynamisch exakt an das Bild an -->
    <div id="scratch-container" class="relative rounded-2xl overflow-hidden shadow-2xl border border-white/20 flex items-center justify-center">
        
        <!-- Das Bild unter der Rubbelschicht -->
        <img id="secret-image" src="invitation.png" alt="Einladung" class="block max-w-[90vw] max-h-[90vh] w-auto h-auto object-contain pointer-events-none">
        
        <!-- Die Rubbelschicht deckt exakt das geladene Bild ab -->
        <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full touch-none cursor-pointer z-10"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('scratch-container');
        const secretImage = document.getElementById('secret-image');

        let isDrawing = false;

        const coverImage = new Image();
        coverImage.src = 'cover.png'; 

        function drawOverlay() {
            // Zeichnet das Texturbild als Untergrund
            ctx.drawImage(coverImage, 0, 0, canvas.width, canvas.height);

            // Text-Einstellungen für "Scratch it off" exakt in der Mitte
            const fontSize = Math.max(20, Math.floor(canvas.width / 12));
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle'; // Zentriert den Text vertikal genau auf der Y-Koordinate

            // Schatten für bessere Lesbarkeit auf der Textur
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // Zeichnet den Text in der absoluten Mitte
            ctx.fillText('Scratch it off', canvas.width / 2, canvas.height / 2);

            // Schatten zurücksetzen, damit das Freirubbeln fehlerfrei klappt
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function initCanvas() {
            canvas.width = secretImage.clientWidth;
            canvas.height = secretImage.clientHeight;

            if (coverImage.complete) {
                drawOverlay();
            } else {
                coverImage.onload = () => {
                    drawOverlay();
                };
            }
        }

        // Sobald das Bild geladen ist, wird der Rahmen passgenau gesetzt
        secretImage.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);
        
        // Falls das Bild aus dem Cache schon geladen ist:
        if (secretImage.complete) {
            initCanvas();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 35, 0, Math.PI * 2, false);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', (e) => { 
            isDrawing = true; 
            scratch(e); 
        });
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { 
            isDrawing = false; 
        });

        canvas.addEventListener('touchstart', (e) => { 
            isDrawing = true; 
            scratch(e); 
            e.preventDefault(); 
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => { 
            scratch(e); 
            e.preventDefault(); 
        }, { passive: false });
        
        window.addEventListener('touchend', () => { 
            isDrawing = false; 
        });
    </script>
</body>
</html>
