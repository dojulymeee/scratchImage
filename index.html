<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Reveal Invitation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            touch-action: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            /* Hintergrundfarbe passend zur Textur */
            background-color: #6b7d8e !important;
        }
    </style>
</head>
<body style="background-color: #6b7d8e !important;" class="text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans select-none overflow-hidden">

    <!-- Haupt-Container für die Einladung -->
    <div id="scratch-container" class="relative w-full max-w-3xl h-[80vh] rounded-2xl overflow-hidden shadow-2xl border border-white/20 flex items-center justify-center">
        
        <!-- Das Bild unter der Rubbelschicht (Deine Einladung) -->
        <img id="secret-image" src="invitation.png" alt="Einladung" class="absolute inset-0 w-full h-full object-contain pointer-events-none">
        
        <!-- Die Rubbelschicht mit deinem Texturbild -->
        <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full touch-none cursor-pointer z-10"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('scratch-container');

        let isDrawing = false;

        // Lade das Texturbild als Rubbelschicht
        const coverImage = new Image();
        coverImage.src = 'cover.png'; // Dein Texturbild für den Rubbeleffekt

        function initCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Zeichne das Texturbild als Abdeckung über die Karte
            if (coverImage.complete) {
                ctx.drawImage(coverImage, 0, 0, canvas.width, canvas.height);
            } else {
                coverImage.onload = () => {
                    ctx.drawImage(coverImage, 0, 0, canvas.width, canvas.height);
                };
            }
        }

        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 35, 0, Math.PI * 2, false);
            ctx.fill();
        }

        // Event-Listener für Maus und Touch-Eingaben
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); }, { passive: false });
        window.addEventListener('touchend', () => { isDrawing = false; });
    </script>
</body>
</html>
